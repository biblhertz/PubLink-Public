map $http_origin $cors_origin {
    default  "";
    ~*^https?://(iiif\.humanitiesconnect\.pub|mirador\.humanitiesconnect\.pub|annotation\.biblhertz\.it|localhost(:[0-9]+)?)$  $http_origin;
    "${MIRADOR_CLIENT}"  $http_origin;
}

server {
     listen 80;
     client_max_body_size 8M;
     index index.php index.html;
     error_log  /var/log/nginx/error.log;
     access_log /var/log/nginx/access.log;
     root /var/www/html;
     location = /api/manifests {
         fastcgi_pass php-fpm:9000;
         include fastcgi_params;
         fastcgi_param SCRIPT_FILENAME /var/www/html/services/iiifPublishService.php;
         # Stock fastcgi_params does not forward Authorization by default —
         # iiifPublishService.php needs it to read the caller-supplied API key.
         fastcgi_param HTTP_AUTHORIZATION $http_authorization;
     }

     location ~ \.php|\.html$ {
         try_files $uri =404;
         fastcgi_split_path_info ^(.+\.php|\.html)(/.+)$;
         fastcgi_pass php-fpm:9000;
         fastcgi_index index.php;
         include fastcgi_params;
         fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
         fastcgi_param PATH_INFO $fastcgi_path_info;
         if ($cors_origin) {
             add_header Access-Control-Allow-Origin $cors_origin;
         }
     }
}


server {
     listen 3000;
     index index.html;
     error_log  /var/log/mirador/error.log;
     access_log /var/log/mirador/access.log;
     root /var/www/mirador/demo/dist;
}
